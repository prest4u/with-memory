name: native-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact tagged version without a leading v
        required: true
        type: string
      source_commit:
        description: Full frozen RC commit reviewed by all signers
        required: true
        type: string
      publish:
        description: Publish the signed GitHub Release after production approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}

jobs:
  frozen-source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited package installer
        run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -e ".[dev]"
      - name: Immutable release identity and embedded trust root
        run: python scripts/check_release_identity.py --version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT"
      - name: Owner attestation schema (requires separate manual verification)
        run: python scripts/verify_release_evidence.py --evidence release/evidence.json --version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Full test suite and coverage
        run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=80
      - run: python -m coverage report --include="src/eric_memory/transactions.py,src/eric_memory/migration.py,src/eric_memory/permissions.py" --fail-under=95
      - run: python scripts/evaluate_search.py
      - run: python scripts/benchmark.py --facts 100000 --files 100000
      - run: python scripts/mac_gate.py
      - name: Audit locked dependencies
        run: |
          python scripts/export_audit_requirements.py --installed --output /tmp/with-audit-requirements.txt
          pip-audit --strict --no-deps --disable-pip --requirement /tmp/with-audit-requirements.txt
      - run: python scripts/secret_scan.py

  native-candidates:
    needs: frozen-source-gates
    environment: production-release
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited package installer
        run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - name: Native PyInstaller onedir build
        run: pyinstaller --clean --noconfirm with.spec

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          export WITH_KEYCHAIN_PASSWORD="$(uuidgen)"
          export WITH_KEYCHAIN="$RUNNER_TEMP/with-release.keychain-db"
          python -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "with-release.p12").write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"], validate=True))'
          security create-keychain -p "$WITH_KEYCHAIN_PASSWORD" "$WITH_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$WITH_KEYCHAIN"
          security unlock-keychain -p "$WITH_KEYCHAIN_PASSWORD" "$WITH_KEYCHAIN"
          security import "$RUNNER_TEMP/with-release.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$WITH_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$WITH_KEYCHAIN_PASSWORD" "$WITH_KEYCHAIN"
          security list-keychain -d user -s "$WITH_KEYCHAIN"
      - name: Sign and verify every macOS Mach-O payload
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          while IFS= read -r -d '' item; do
            if file "$item" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$item"
            fi
          done < <(find dist/with/_internal -type f -print0)
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" dist/with/eric-memory
          codesign --verify --deep --strict --verbose=2 dist/with/eric-memory

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Windows signing credentials are missing" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\with-release.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
      - name: Sign and verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\with-release.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" dist\with\eric-memory.exe
          signtool verify /pa /v dist\with\eric-memory.exe

      - name: Frozen clean-data workflow and startup gates
        run: python scripts/release_smoke.py --executable "dist/with/${{ runner.os == 'Windows' && 'eric-memory.exe' || 'eric-memory' }}" --max-first-startup 1.5
      - name: Package one native candidate
        run: python scripts/package_release.py --version "${{ inputs.version }}" --platform "${{ matrix.platform }}" --collection dist/with --output-dir release

      - name: Apple notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          xcrun notarytool submit "release/with-$RELEASE_VERSION-${{ matrix.platform }}.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}
          path: release/with-${{ inputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

  signed-candidate:
    needs: native-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited package installer
        run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: release
          merge-multiple: true
      - name: Runtime dependency SBOM
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/with-runtime"
          "$RUNNER_TEMP/with-runtime/bin/python" -m pip install --upgrade "pip==26.2.1"
          "$RUNNER_TEMP/with-runtime/bin/python" -m pip install .
          cyclonedx-py environment "$RUNNER_TEMP/with-runtime/bin/python" --output-format JSON --output-file "release/with-$RELEASE_VERSION-sbom.cdx.json"
      - name: Create exactly-four-artifact manifest
        run: python scripts/create_release_manifest.py --version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT" --output "release/with-$RELEASE_VERSION-manifest.json" release/*.zip
      - name: Sign and verify release manifest
        shell: bash
        env:
          WITH_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.WITH_RELEASE_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$WITH_RELEASE_PRIVATE_KEY_BASE64"
          python -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "with-release-private.pem").write_bytes(base64.b64decode(os.environ["WITH_RELEASE_PRIVATE_KEY_BASE64"], validate=True))'
          python scripts/sign_release_manifest.py --manifest "release/with-$RELEASE_VERSION-manifest.json" --private-key "$RUNNER_TEMP/with-release-private.pem" --public-key src/eric_memory/resources/release-public-key.pem --output "release/with-$RELEASE_VERSION-manifest.json.sig"
      - name: Signed checksums
        shell: bash
        run: sha256sum release/*.zip release/*-manifest.json release/*-manifest.json.sig release/*-sbom.cdx.json > release/SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.zip
            release/*-manifest.json
            release/*-manifest.json.sig
            release/*-sbom.cdx.json
            release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate-${{ inputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish approved GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --version "$RELEASE_VERSION" --release-dir release
