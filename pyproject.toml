[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eric-memory"
version = "0.1.0"
description = "With.: local-first memory for your harness. Owned SQLite, deprecate-not-delete, CLI + MCP"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eric" }]
keywords = ["memory", "mcp", "obsidian", "local-first", "sqlite"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Intended Audience :: Developers",
]
dependencies = [
  "cryptography==50.0.1",
  "mcp==2.1.1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.16.0",
  "cyclonedx-bom==7.3.1",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pyinstaller==6.22.2",
  "ruff==0.16.4",
]

[project.scripts]
eric-memory = "eric_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eric_memory = ["py.typed", "resources/*", "resources/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/eric_memory"]
warn_unused_ignores = true
exclude = ["src/eric_memory.egg-info"]
